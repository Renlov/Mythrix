name = "mythrix"
main = "src/index.ts"
compatibility_date = "2025-05-01"

# D1 — создать через `wrangler d1 create mythrix`, вставить database_id ниже.
[[d1_databases]]
binding = "DB"
database_name = "mythrix"
database_id = "0ff03597-7643-43b8-a9f8-6f03942b2996"

# Секреты задаются НЕ здесь, а через wrangler (не коммитятся):
#   wrangler secret put DEEPSEEK_API_KEY
#   wrangler secret put TELEGRAM_BOT_TOKEN
# Локально — через server/.dev.vars (в .gitignore).

# Бандлим .txt (системный промпт) как текстовый модуль.
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true

[vars]
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
WORLD_ID = "tavern"
RULESET_ID = "dnd_v1"
WEBAPP_URL = "https://mythrix.pages.dev"

# TELEGRAM_WEBHOOK_SECRET — секрет для валидации Telegram webhook.
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
# После задания секрета поставить webhook (один раз):
#   curl "https://api.telegram.org/bot<TOKEN>/setWebhook?url=https://<WORKER_URL>/telegram-webhook&secret_token=<SECRET>"

# Cron Trigger — раз в час сканирует игроков, которым пора напомнить о возвращении.
[triggers]
crons = ["0 * * * *"]
